name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld xxd unzip curl
      - name: Get PS5 payload SDK
        run: |
          curl -L -o sdk.zip https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q sdk.zip -d /opt
          ls /opt
      - name: Build
        run: make PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: vlc-bridge
          path: vlc-bridge.elf
